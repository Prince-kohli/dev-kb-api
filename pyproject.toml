[project]
name = "dev-kb-api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Akshay", email = "iakshaykofficial@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi[standard]>=0.165.0",
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
    "pytest>=9.2.0",
    "sqlmodel>=0.0.50",
    "uvicorn>=0.54.0",
]

[project.scripts]
dev-kb-api = "dev_kb_api:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
[tool.pytest.ini_options]
pythonpath = "."